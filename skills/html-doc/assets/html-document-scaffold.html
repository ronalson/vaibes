<!doctype html>
<html lang="{{document-language}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{Document Title}}</title>
    <script>
      (() => {
        let savedTheme = null;
        try { savedTheme = localStorage.getItem("theme"); } catch (_) {}
        document.documentElement.classList.toggle("dark", savedTheme === "dark");
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html { --status-danger-bg: rgb(254 242 242); --status-danger-border: rgb(254 202 202); --status-danger-text: rgb(185 28 28); --status-success-bg: rgb(240 253 244); --status-success-border: rgb(187 247 208); --status-success-text: rgb(21 128 61); --status-warning-bg: rgb(255 251 235); --status-warning-border: rgb(253 230 138); --status-warning-text: rgb(146 64 14); color-scheme: light; scroll-behavior: smooth; }
      html.dark { --theme-page: rgb(2 6 23); --theme-surface: rgb(15 23 42); --theme-muted-surface: rgb(30 41 59); --theme-heading: rgb(248 250 252); --theme-text: rgb(226 232 240); --theme-secondary: rgb(203 213 225); --theme-muted: rgb(148 163 184); --theme-border: rgb(51 65 85); --theme-strong-border: rgb(100 116 139); --status-danger-bg: rgb(69 10 10); --status-danger-border: rgb(153 27 27); --status-danger-text: rgb(252 165 165); --status-success-bg: rgb(5 46 22); --status-success-border: rgb(22 101 52); --status-success-text: rgb(134 239 172); --status-warning-bg: rgb(69 26 3); --status-warning-border: rgb(146 64 14); --status-warning-text: rgb(252 211 77); color-scheme: dark; }
      body { text-wrap: pretty; }
      .dark body { background-color: var(--theme-page); color: var(--theme-text); }
      .dark .bg-white { background-color: var(--theme-surface); }
      .dark .bg-slate-50, .dark .bg-slate-100 { background-color: var(--theme-muted-surface); }
      .dark .text-slate-950, .dark .text-slate-900 { color: var(--theme-heading); }
      .dark .text-slate-700, .dark .text-slate-600 { color: var(--theme-secondary); }
      .dark .text-slate-500 { color: var(--theme-muted); }
      .dark .border-slate-200, .dark .border-slate-300 { border-color: var(--theme-border); }
      .dark .border-slate-400, .dark .border-slate-900, .dark .border-slate-950 { border-color: var(--theme-strong-border); }
      .dark .divide-slate-200 > :not([hidden]) ~ :not([hidden]) { border-color: var(--theme-border); }
      .dark .hover\:text-slate-950:hover { color: var(--theme-heading); }
      .status-danger { background-color: var(--status-danger-bg); border-color: var(--status-danger-border); }
      .status-danger .status-label { color: var(--status-danger-text); }
      .status-success { background-color: var(--status-success-bg); border-color: var(--status-success-border); }
      .status-success .status-label { color: var(--status-success-text); }
      .status-warning { background-color: var(--status-warning-bg); border-color: var(--status-warning-border); }
      .status-warning .status-label { color: var(--status-warning-text); }
      @media print {
        html.dark { --theme-page: rgb(255 255 255); --theme-surface: rgb(255 255 255); --theme-muted-surface: rgb(241 245 249); --theme-heading: rgb(2 6 23); --theme-text: rgb(15 23 42); --theme-secondary: rgb(71 85 105); --theme-muted: rgb(100 116 139); --theme-border: rgb(226 232 240); --theme-strong-border: rgb(148 163 184); --status-danger-bg: rgb(254 242 242); --status-danger-border: rgb(254 202 202); --status-danger-text: rgb(185 28 28); --status-success-bg: rgb(240 253 244); --status-success-border: rgb(187 247 208); --status-success-text: rgb(21 128 61); --status-warning-bg: rgb(255 251 235); --status-warning-border: rgb(253 230 138); --status-warning-text: rgb(146 64 14); color-scheme: light; }
        body { background: #fff !important; } main { max-width: none !important; padding: 0 !important; } #theme-toggle { display: none !important; } section, figure, table { break-inside: avoid; }
      }
    </style>
  </head>
  <body class="bg-stone-50 text-slate-900 font-sans antialiased">
    <main class="mx-auto w-full max-w-5xl space-y-12 px-5 py-10 sm:px-8 sm:py-12">
      <header><h1 class="text-3xl font-semibold text-slate-950">{{Document Title}}</h1></header>
      <section id="section-01">{{Document content}}</section>
    </main>
    <button id="theme-toggle" type="button" class="fixed bottom-5 right-5 z-50 inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-300 bg-white text-slate-700 shadow-sm hover:border-slate-400 hover:text-slate-950 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-500 focus-visible:ring-offset-2" aria-pressed="false" aria-label="Switch to dark mode">
      <svg id="theme-icon-moon" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z" /></svg>
      <svg id="theme-icon-sun" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" /></svg>
    </button>
    <script>
      (() => {
        const root = document.documentElement;
        const toggle = document.querySelector("#theme-toggle");
        const moonIcon = document.querySelector("#theme-icon-moon");
        const sunIcon = document.querySelector("#theme-icon-sun");
        function updateToggle() { const isDark = root.classList.contains("dark"); toggle.setAttribute("aria-pressed", String(isDark)); toggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode"); moonIcon.classList.toggle("hidden", isDark); sunIcon.classList.toggle("hidden", !isDark); }
        toggle.addEventListener("click", () => { const isDark = root.classList.toggle("dark"); try { localStorage.setItem("theme", isDark ? "dark" : "light"); } catch (_) {} updateToggle(); });
        updateToggle();
      })();
    </script>
  </body>
</html>
